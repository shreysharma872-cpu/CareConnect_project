databases:
  - name: careconnect-db
    plan: free
    databaseName: careconnect
    user: careconnect

services:
  - type: web
    name: careconnect-api
    runtime: rust
    rootDir: backend
    plan: free
    buildCommand: cargo build --release --locked
    startCommand: ./target/release/careconnect-backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: RUST_BACKEND_HOST
        value: 0.0.0.0

  - type: web
    name: careconnect-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: RUST_BACKEND_HOSTPORT
        fromService:
          name: careconnect-api
          type: web
          property: hostport
      - key: SESSION_SECRET
        fromService:
          name: careconnect-api
          type: web
          envVarKey: SESSION_SECRET
      - key: CRON_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ENABLE_IN_APP_REMINDER_SCHEDULER
        value: "false"
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: careconnect-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
